<div class="flex flex-col flex-1 items-center justify-center px-4 py-8">
  <h3 class="text-3xl font-bold text-gradient mb-2">Наши проекты</h3>
  <p class="text-(--text-secondary) text-center max-w-xl mb-8">
    Репозитории команды Lazy And Focused за год (даже приватные)
  </p>

  <div class="flex flex-col gap-4">
    @let repositories = sorted();
    <div class="flex flex-col gap-1">
      <h3>Созданы:</h3>
      <projects-list [repositories]="repositories.created" />
    </div>

    <div class="flex flex-col gap-1">
      <h3>Обновлены:</h3>
      <projects-list [repositories]="repositories.updated" />
    </div>
  </div>
</div>
