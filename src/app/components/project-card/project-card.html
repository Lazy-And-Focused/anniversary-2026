<a
  [href]="repository.homepage || repository.html_url"
  target="_blank"
  rel="noopener noreferrer"
  class="group flex flex-col bg-(--bg-card) border border-(--border-card) rounded-2xl p-6 backdrop-blur-sm transition-all duration-300 ease-in-out shadow-(--shadow-card) hover:-translate-y-1.5 hover:border-(--accent-start) hover:shadow-(--shadow-hover) no-underline text-(--text-primary) h-full"
>
  <div class="flex items-start justify-between gap-2">
    <h4 class="text-lg font-bold text-gradient truncate">
      {{ repository.name }}
    </h4>
    <div class="flex shrink-0 gap-1">
      @if (repository.archived) {
        <span
          class="inline-block rounded-full bg-red-500/20 px-2 py-0.5 text-xs font-medium text-red-400"
        >
          Archived
        </span>
      }
      @if (repository.disabled) {
        <span
          class="inline-block rounded-full bg-gray-500/20 px-2 py-0.5 text-xs font-medium text-gray-400"
        >
          Disabled
        </span>
      }
    </div>
  </div>

  @if (repository.description) {
    <p class="mt-2 text-sm text-(--text-secondary) line-clamp-3">
      {{ repository.description }}
    </p>
  }

  <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1 text-xs text-(--text-secondary)">
    <span class="flex items-center gap-1">
      <span>📅</span>
      <span>{{ formatDate(repository.created_at) }}</span>
    </span>
    @if (repository.homepage) {
      <span class="flex items-center gap-1">
        <span>🔗</span>
        <span class="truncate max-w-30">{{ repository.homepage }}</span>
      </span>
    }
    <span class="flex items-center gap-1 ml-auto">
      <span>📂</span>
      <span>{{ repository.full_name }}</span>
    </span>
  </div>
</a>
